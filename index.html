<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>කාර්ය මණ්ඩල පුවරුව — ධර්මරාජ විද්‍යාලය, වේයන්ගොඩ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#3A0A1E;
  --ground-2:#5C1129;
  --card:#FFFFFF;
  --ink:#241417;
  --ink-soft:#6B5B5E;
  --ink-faint:#9C8D90;
  --line:#EBE0DE;
  --line-soft:#F4ECEA;
  --brand:#7A0F2E;
  --brand-dark:#560A20;
  --saffron:#C9911A;
  --saffron-soft:#FBF1DA;
  --error:#B03A2E;
  --error-soft:#FCEFED;
  --ok:#1A7A60;
  --ok-soft:#EAF5F1;
  --r:10px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:var(--line-soft);
  font-family:'Noto Sans Sinhala', system-ui, sans-serif;
  color:var(--ink);
  line-height:1.55;
  font-size:15px;
}
button{ font-family:inherit; cursor:pointer; }
button:focus-visible, input:focus-visible, select:focus-visible{
  outline:3px solid var(--saffron); outline-offset:2px;
}

/* ================= LOGIN ================= */
.login-wrap{
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:24px calc(16px + env(safe-area-inset-left,0px)) 24px calc(16px + env(safe-area-inset-right,0px));
  background:
    radial-gradient(1100px 620px at 50% -8%, #7A1030 0%, transparent 62%),
    linear-gradient(175deg, var(--ground-2) 0%, var(--ground) 62%, #1E0611 100%);
}
.login-card{
  width:100%; max-width:380px;
  background:var(--card);
  border-radius:14px;
  box-shadow:0 24px 60px rgba(0,0,0,.35);
  padding:34px 28px 28px;
  text-align:center;
}
.login-card .crest{
  width:72px; height:72px; border-radius:50%; object-fit:cover;
  margin:0 auto 16px;
  box-shadow:0 0 0 3px #fff, 0 0 0 5px rgba(201,145,26,.6);
}
.login-card h1{
  font-family:'Noto Serif Sinhala', serif;
  font-size:19px; font-weight:700; margin:0 0 4px;
}
.login-card .sub{
  font-size:13px; color:var(--ink-soft); margin:0 0 24px;
}
.f{ margin-bottom:16px; text-align:left; }
.f label{
  display:block; font-size:13.5px; font-weight:500;
  margin-bottom:6px; color:#2C3A37; text-align:left;
}
input[type=email], input[type=password], input[type=text], input[type=search], select{
  width:100%; padding:11px 13px; font-size:15px; font-family:inherit;
  color:var(--ink); background:#FCFDFD; border:1.5px solid var(--line);
  border-radius:8px; transition:border-color .15s, box-shadow .15s;
}
input:hover, select:hover{ border-color:#BFCCC8; }
input:focus, select:focus{
  outline:none; background:#fff; border-color:var(--brand);
  box-shadow:0 0 0 3.5px rgba(122,15,46,.13);
}
.btn{
  width:100%; padding:13px 18px; font-size:15.5px; font-weight:600;
  border:none; border-radius:8px; color:#fff; background:var(--brand);
  transition:background .15s;
}
.btn:hover:not(:disabled){ background:var(--brand-dark); }
.btn:disabled{ background:#B9AEB0; cursor:not-allowed; }
.btn-sm{
  padding:9px 14px; font-size:13.5px; font-weight:600;
  border:1.5px solid var(--line); border-radius:8px;
  background:#fff; color:var(--brand-dark);
}
.btn-sm:hover{ border-color:var(--brand); }
.btn-ghost{
  padding:8px 14px; font-size:13.5px; font-weight:500;
  border:1.5px solid rgba(255,255,255,.35); border-radius:8px;
  background:transparent; color:#fff;
}
.btn-ghost:hover{ background:rgba(255,255,255,.12); }
.btn-danger{
  padding:8px 13px; font-size:13px; font-weight:600;
  border:1.5px solid var(--error); border-radius:8px;
  background:#fff; color:var(--error);
}
.btn-danger:hover{ background:var(--error-soft); }

.status{
  margin:0 0 14px; padding:10px 12px; border-radius:8px;
  font-size:13px; font-weight:500; text-align:center; display:none;
}
.status.on{ display:block; }
.status.error{ background:var(--error-soft); color:var(--error); }
.status.ok{ background:var(--ok-soft); color:var(--ok); }

/* ================= APP SHELL ================= */
#appView{ display:none; min-height:100vh; }

.topbar{
  display:flex; align-items:center; gap:14px;
  padding:14px 20px; padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:linear-gradient(175deg, var(--ground-2), var(--ground));
  color:#fff;
}
.topbar .crest-sm{
  width:40px; height:40px; border-radius:50%; object-fit:cover; flex:none;
  box-shadow:0 0 0 2px rgba(255,255,255,.85), 0 0 0 3.5px rgba(201,145,26,.65);
}
.topbar-text{ flex:1; min-width:0; }
.topbar-text strong{
  display:block; font-family:'Noto Serif Sinhala', serif; font-size:15.5px;
}
.topbar-text span{ font-size:12px; color:#E7BE6B; }
.who{ display:flex; align-items:center; gap:10px; flex:none; }
.who #whoName{ font-size:12.5px; color:#F0DAB8; display:none; }
@media (min-width:560px){ .who #whoName{ display:inline; } }

.tabs{
  display:flex; gap:4px; padding:0 16px;
  background:#fff; border-bottom:1px solid var(--line);
  overflow-x:auto;
}
.tab{
  padding:13px 16px; font-size:14px; font-weight:600;
  background:none; border:none; color:var(--ink-soft);
  border-bottom:2.5px solid transparent; white-space:nowrap;
}
.tab.on{ color:var(--brand); border-bottom-color:var(--brand); }

.main{ max-width:1000px; margin:0 auto; padding:20px 16px 60px; }
.panel{ display:none; }
.panel.on{ display:block; }

.toolbar{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px;
  margin-bottom:16px;
}
.toolbar #searchBox{ flex:1; min-width:180px; }
.toolbar .count{ font-size:13px; color:var(--ink-soft); white-space:nowrap; }

.table-wrap{
  background:#fff; border-radius:var(--r); overflow:auto;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  border:1px solid var(--line);
}
table{ width:100%; border-collapse:collapse; min-width:560px; }
thead th{
  text-align:left; font-size:12.5px; font-weight:600; color:var(--ink-soft);
  padding:12px 14px; border-bottom:1.5px solid var(--line); background:var(--line-soft);
  white-space:nowrap;
}
tbody td{
  padding:12px 14px; font-size:14px; border-bottom:1px solid var(--line-soft);
  text-align:left; vertical-align:middle;
}
tbody tr:last-child td{ border-bottom:none; }
tbody tr{ cursor:pointer; transition:background .1s; }
tbody tr:hover{ background:#FBF6F2; }
td.name{ font-weight:600; color:var(--ink); text-align:left; }
.badge{
  display:inline-block; padding:3px 10px; border-radius:99px;
  font-size:11.5px; font-weight:600; background:var(--saffron-soft); color:#7A5610;
}
.badge.admin{ background:#F1E3EA; color:var(--brand-dark); }

.empty{ text-align:center; color:var(--ink-faint); padding:40px 20px; font-size:14px; }

.avatar{
  width:34px; height:34px; border-radius:50%; object-fit:cover;
  background:var(--line-soft); display:block;
}
.avatar-lg{
  width:84px; height:84px; border-radius:12px; object-fit:cover;
  background:var(--line-soft); margin:0 0 14px; box-shadow:0 2px 10px rgba(0,0,0,.12);
}
td.photo-cell{ width:44px; padding-right:4px; }

#classFilter{ max-width:200px; }

.class-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 0; border-bottom:1px solid var(--line-soft); cursor:pointer;
}
.class-row:last-child{ border-bottom:none; }
.class-row:hover{ background:#FBF6F2; }
.class-row .cname{ font-weight:600; font-size:14.5px; }
.class-row .ccount{ font-size:13px; color:var(--ink-soft); }

.card-block{
  background:#fff; border-radius:var(--r); padding:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.06); border:1px solid var(--line);
  margin-bottom:20px;
}
.card-block h2{
  font-family:'Noto Serif Sinhala', serif; font-size:16.5px; margin:0 0 16px;
  text-align:left; color:var(--brand-dark);
}
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
@media (max-width:480px){ .grid2{ grid-template-columns:1fr; } }

.staff-row{
  display:flex; align-items:center; gap:12px;
  padding:12px 0; border-bottom:1px solid var(--line-soft);
}
.staff-row:last-child{ border-bottom:none; }
.staff-row .info{ flex:1; min-width:0; text-align:left; }
.staff-row .info strong{ display:block; font-size:14.5px; }
.staff-row .info span{ font-size:12.5px; color:var(--ink-soft); }

/* ================= MODAL ================= */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(20,8,14,.55);
  display:none; align-items:flex-end; justify-content:center; z-index:100;
  padding:0;
}
.modal-backdrop.on{ display:flex; }
.modal{
  background:#fff; width:100%; max-width:560px;
  border-radius:16px 16px 0 0;
  max-height:88vh; display:flex; flex-direction:column;
  animation:slideup .2s ease;
}
@media (min-width:640px){
  .modal-backdrop{ align-items:center; }
  .modal{ border-radius:14px; max-height:80vh; }
}
@keyframes slideup{ from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
.modal-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 20px; border-bottom:1px solid var(--line);
}
.modal-head h2{
  font-family:'Noto Serif Sinhala', serif; font-size:17px; margin:0;
}
.icon-btn{
  width:32px; height:32px; border-radius:50%; border:none;
  background:var(--line-soft); color:var(--ink-soft); font-size:15px;
}
.icon-btn:hover{ background:var(--line); }
.modal-body{ padding:16px 20px; overflow-y:auto; }
.rrow{
  display:grid; grid-template-columns:120px 1fr; gap:12px;
  padding:9px 0; font-size:14px; border-bottom:1px solid var(--line-soft);
}
.rrow span{ color:var(--ink-soft); }
.rrow b{ font-weight:600; text-align:left; }
.rrow b.none{ color:var(--ink-faint); font-weight:400; }
.rgroup-title{
  font-family:'Noto Serif Sinhala', serif; font-size:13.5px; color:var(--brand-dark);
  margin:16px 0 4px; text-align:left;
}
.rgroup-title:first-child{ margin-top:6px; }
.modal-foot{
  padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end;
}
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <div class="crest" style="background:#7A0F2E; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:bold;">ධ.වි</div>
    <h1>ධර්මරාජ විද්‍යාලය</h1>
    <div class="sub">කාර්ය මණ්ඩල තොරතුරු පද්ධතිය</div>
    <div id="loginStatus" class="status"></div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="f">
        <label for="email">විද්‍යුත් තැපෑල (Email)</label>
        <input type="email" id="email" required placeholder="user@dharmaraja.lk" />
      </div>
      <div class="f">
        <label for="password">මුරපදය (Password)</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn">ඇතුළු වන්න</button>
    </form>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appView">
  <div class="topbar">
    <div class="crest-sm" style="background:#7A0F2E; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:bold; font-size:12px;">ධ.වි</div>
    <div class="topbar-text">
      <strong>ධර්මරාජ විද්‍යාලය, වේයන්ගොඩ</strong>
      <span>කාර්ය මණ්ඩල පුවරුව</span>
    </div>
    <div class="who">
      <span id="whoName">පරිපාලක</span>
      <button class="btn-ghost" onclick="handleLogout()">නික්මෙන්න</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="switchTab('staff', this)">සියලු කාර්ය මණ්ඩලය</button>
    <button class="tab" onclick="switchTab('classes', this)">පන්ති භාර ගුරුභවතුන්</button>
  </div>

  <div class="main">
    <!-- Panel 1: Staff Directory -->
    <div id="staffPanel" class="panel on">
      <div class="toolbar">
        <input type="search" id="searchBox" placeholder="නම හෝ විෂය අනුව සොයන්න..." oninput="renderStaffTable()" />
        <select id="classFilter" onchange="renderStaffTable()">
          <option value="">සියලුම ශ්‍රේණි</option>
          <option value="11">11 ශ්‍රේණිය</option>
          <option value="12">12 ශ්‍රේණිය</option>
          <option value="13">13 ශ්‍රේණිය</option>
        </select>
        <span class="count" id="staffCount">ගුරුවරුන් 0 යි</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="photo-cell"></th>
              <th>නම</th>
              <th>පදවිය / විෂය</th>
              <th>පන්තිය</th>
              <th>දුරකථන අංකය</th>
            </tr>
          </thead>
          <tbody id="staffTableBody">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Panel 2: Classes View -->
    <div id="classesPanel" class="panel">
      <div class="card-block">
        <h2>පන්ති සංවිධානය</h2>
        <div id="classList">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="mName">ගුරු විස්තර</h2>
      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="mBody">
      <!-- Content populated by JS -->
    </div>
    <div class="modal-foot">
      <button class="btn-sm" onclick="closeModal()">වසා දමන්න</button>
    </div>
  </div>
</div>

<script>
// Mock Staff Data
const staffData = [
  { id: 1, name: "ඒ. එම්. බණ්ඩාර මහතා", role: "විදුහල්පති", subject: "පරිපාලන", grade: "-", phone: "0771234567", email: "principal@dharmaraja.lk" },
  { id: 2, name: "කේ. පී. පෙරේරා මහත්මිය", role: "ගුරු", subject: "සිංහල", grade: "11-A", phone: "0718765432", email: "perera@dharmaraja.lk" },
  { id: 3, name: "එස්. එච්. සිල්වා මහතා", role: "ගුරු", subject: "ගණිතය", grade: "11-B", phone: "0752345678", email: "silva@dharmaraja.lk" },
  { id: 4, name: "ඩී. එම්. ප්‍රනාන්දු මහත්මිය", role: "ගුරු", subject: "විද්‍යාව", grade: "12-A", phone: "0783456789", email: "fernando@dharmaraja.lk" },
  { id: 5, name: "ආර්. එම්. ජයසිංහ මහතා", role: "ගුරු", subject: "ඉංග්‍රීසි", grade: "13-A", phone: "0724567890", email: "jayasinghe@dharmaraja.lk" }
];

function handleLogin(e) {
  e.preventDefault();
  const status = document.getElementById('loginStatus');
  status.className = 'status ok on';
  status.innerText = 'ඇතුළු වීම සාර්ථකයි...';
  
  setTimeout(() => {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('appView').style.display = 'block';
    renderStaffTable();
    renderClassList();
  }, 600);
}

function handleLogout() {
  document.getElementById('appView').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('loginStatus').className = 'status';
}

function switchTab(tabName, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  
  btn.classList.add('on');
  if(tabName === 'staff') {
    document.getElementById('staffPanel').classList.add('on');
  } else {
    document.getElementById('classesPanel').classList.add('on');
  }
}

function renderStaffTable() {
  const query = document.getElementById('searchBox').value.toLowerCase();
  const gradeFilter = document.getElementById('classFilter').value;
  const tbody = document.getElementById('staffTableBody');
  
  const filtered = staffData.filter(s => {
    const matchesSearch = s.name.toLowerCase().includes(query) || s.subject.toLowerCase().includes(query);
    const matchesGrade = gradeFilter ? s.grade.startsWith(gradeFilter) : true;
    return matchesSearch && matchesGrade;
  });

  document.getElementById('staffCount').innerText = `ගුරුවරුන් ${filtered.length} යි`;

  if(filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty">තොරතුරු හමු නොවීය.</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(s => `
    <tr onclick="openModal(${s.id})">
      <td class="photo-cell"><div class="avatar"></div></td>
      <td class="name">${s.name}</td>
      <td>${s.subject} <br><small style="color:var(--ink-soft);">${s.role}</small></td>
      <td>${s.grade !== '-' ? `<span class="badge">${s.grade}</span>` : '-'}</td>
      <td>${s.phone}</td>
    </tr>
  `).join('');
}

function renderClassList() {
  const container = document.getElementById('classList');
  const classes = staffData.filter(s => s.grade !== '-');
  
  container.innerHTML = classes.map(c => `
    <div class="class-row" onclick="openModal(${c.id})">
      <div>
        <div class="cname">${c.grade} පන්තිය</div>
        <div class="ccount">පන්ති භාර: ${c.name}</div>
      </div>
      <span class="badge">${c.subject}</span>
    </div>
  `).join('');
}

function openModal(id) {
  const person = staffData.find(s => s.id === id);
  if(!person) return;

  document.getElementById('mName').innerText = person.name;
  document.getElementById('mBody').innerHTML = `
    <div class="rgroup-title">පෞද්ගලික හා වෘත්තීය තොරතුරු</div>
    <div class="rrow"><span>තනතුර:</span><b>${person.role}</b></div>
    <div class="rrow"><span>ප්‍රධාන විෂය:</span><b>${person.subject}</b></div>
    <div class="rrow"><span>පාරායන පන්තිය:</span><b>${person.grade}</b></div>
    <div class="rgroup-title">සම්බන්ධතා තොරතුරු</div>
    <div class="rrow"><span>දුරකථනය:</span><b>${person.phone}</b></div>
    <div class="rrow"><span>විද්‍යුත් තැපෑල:</span><b>${person.email}</b></div>
  `;
  
  document.getElementById('detailModal').classList.add('on');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('on');
}
</script>
</body>
</html>
