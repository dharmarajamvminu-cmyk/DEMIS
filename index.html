<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ගුරු දත්ත ගබඩාව</title>
<style>
  :root{
    --blue:#4A90D9; --blue-dark:#3a76b3; --bg:#f4f6f9; --card:#ffffff;
    --border:#d7dde5; --text:#28313c; --muted:#6b7684; --danger:#d9534f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Sinhala",Arial,sans-serif;
    background:var(--bg); color:var(--text);
  }
  header{
    background:var(--blue); color:#fff; padding:16px 20px;
    font-size:1.3rem; font-weight:600; text-align:center;
  }
  .wrap{max-width:960px; margin:0 auto; padding:16px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:18px 20px; margin-bottom:18px;
  }
  .card h2{margin-top:0; font-size:1.05rem; color:var(--blue-dark);}
  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px 18px;
  }
  @media(max-width:640px){ .grid{grid-template-columns:1fr;} }
  .field label{
    display:block; font-size:0.85rem; color:var(--muted); margin-bottom:4px;
  }
  .field input, .field select, .field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px;
    font-size:0.95rem; background:#fff; color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--blue);
  }
  .span2{grid-column:1 / -1;}
  .btn-row{
    display:flex; gap:10px; justify-content:flex-end; margin-top:16px;
  }
  button{
    cursor:pointer; border:none; border-radius:6px; padding:10px 18px;
    font-size:0.95rem; font-weight:600;
  }
  .btn-primary{background:var(--blue); color:#fff;}
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-secondary{background:#e7ebf0; color:var(--text);}
  .btn-secondary:hover{background:#dbe0e6;}
  .btn-danger{background:var(--danger); color:#fff; padding:6px 10px; font-size:0.8rem;}
  .btn-small{padding:6px 10px; font-size:0.8rem;}
  table{
    width:100%; border-collapse:collapse; font-size:0.85rem;
  }
  th, td{
    border:1px solid var(--border); padding:8px; text-align:left; vertical-align:top;
  }
  th{background:#eef2f7; color:var(--blue-dark); position:sticky; top:0;}
  .table-scroll{overflow-x:auto;}
  .toolbar{
    display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between;
    align-items:center; margin-bottom:12px;
  }
  .search{flex:1; min-width:180px;}
  .search input{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px;
  }
  .empty{color:var(--muted); text-align:center; padding:24px; font-style:italic;}
  .count{color:var(--muted); font-size:0.85rem;}
  .actions-cell{white-space:nowrap;}
  .actions-cell button{margin-right:4px;}
</style>
</head>
<body>

<header>ගුරු දත්ත ගබඩාව / Teacher Database</header>

<div class="wrap">

  <div class="card">
    <h2 id="formTitle">නව ගුරුවරයෙකු එක් කරන්න (Add New Teacher)</h2>
    <form id="teacherForm">
      <input type="hidden" id="recordId">
      <div class="grid">

        <div class="field">
          <label>ජාතික හැඳුනුම්පත් අංකය * (NIC No.)</label>
          <input type="text" id="nic" required>
        </div>

        <div class="field">
          <label>සම්පූර්ණ නම (Full Name) *</label>
          <input type="text" id="fullName" required>
        </div>

        <div class="field span2">
          <label>ලිපිනය (Address)</label>
          <textarea id="address" rows="2"></textarea>
        </div>

        <div class="field">
          <label>උපන් දිනය (Date of Birth)</label>
          <input type="date" id="dob">
        </div>

        <div class="field">
          <label>ස්ත්‍රී/පුරුෂ භාවය (Gender)</label>
          <select id="gender">
            <option value="">-- තෝරන්න --</option>
            <option value="ස්ත්‍රී">ස්ත්‍රී (Female)</option>
            <option value="පුරුෂ">පුරුෂ (Male)</option>
          </select>
        </div>

        <div class="field">
          <label>දුරකථන අංකය (Phone No.)</label>
          <input type="tel" id="phone">
        </div>

        <div class="field">
          <label>Whatsapp අංකය (WhatsApp No.)</label>
          <input type="tel" id="whatsapp">
        </div>

        <div class="field">
          <label>තනතුර (Position)</label>
          <select id="position">
            <option value="">-- තෝරන්න --</option>
            <option value="ගුරු">ගුරු (Teacher)</option>
            <option value="ප්‍රධාන ගුරු">ප්‍රධාන ගුරු (Head Teacher)</option>
            <option value="උප ගුරු">උප ගුරු (Deputy)</option>
            <option value="ක්‍රීඩා පුහුණුකරු">ක්‍රීඩා පුහුණුකරු (Sports Coach)</option>
            <option value="සංවර්ධන නිළධාරි">සංවර්ධන නිළධාරි (Development Officer)</option>
            <option value="අනෙකුත්">අනෙකුත් (Other)</option>
          </select>
        </div>

        <div class="field">
          <label>ශ්‍රේණිය (Grade / Class)</label>
          <input type="text" id="grade">
        </div>

        <div class="field">
          <label>මුල්පත්වීම් දිනය (First Appointment Date)</label>
          <input type="date" id="firstAppointDate">
        </div>

        <div class="field">
          <label>මෙම විද්‍යාලයට පත් වූ දිනය (Date Joined This School)</label>
          <input type="date" id="schoolJoinDate">
        </div>

        <div class="field">
          <label>අධ්‍යාපන සුදුසුකම් (Educational Qualifications)</label>
          <input type="text" id="eduQual">
        </div>

        <div class="field">
          <label>වෘත්තීය සුදුසුකම් (Professional Qualifications)</label>
          <input type="text" id="profQual">
        </div>

        <div class="field">
          <label>ලේඛනයේ අංකය (Register No.)</label>
          <input type="text" id="regNo">
        </div>

        <div class="field">
          <label>වැන්දඹු/අනාථ අංකය (Widows'/Orphans' No.)</label>
          <input type="text" id="worpNo">
        </div>

        <div class="field span2">
          <label>මීට පෙර සේවය කළ පාසල (Previous School)</label>
          <input type="text" id="prevSchool">
        </div>

        <div class="field">
          <label>එම පාසලේ සේවය කළ කාලය (Period Served There)</label>
          <input type="text" id="prevPeriod">
        </div>

        <div class="field">
          <label>වැටුප් ලබන ගිණුම් අංකය (Salary Account No.)</label>
          <input type="text" id="acctNo">
        </div>

        <div class="field">
          <label>බැංකුව (Bank)</label>
          <select id="bank">
            <option value="">-- තෝරන්න --</option>
            <option value="මහජන බැංකුව">මහජන බැංකුව (People's Bank)</option>
            <option value="ලංකා බැංකුව">ලංකා බැංකුව (Bank of Ceylon)</option>
            <option value="ජාතික ඉතිරිකිරීමේ බැංකුව">ජාතික ඉතිරිකිරීමේ බැංකුව (NSB)</option>
            <option value="රාජ්‍ය උකස් හා ආයෝජන බැංකුව">රාජ්‍ය උකස් හා ආයෝජන බැංකුව (SMIB)</option>
            <option value="අනෙකුත්">අනෙකුත් (Other)</option>
          </select>
        </div>

        <div class="field">
          <label>ශාඛාව (Branch)</label>
          <input type="text" id="branch">
        </div>

      </div>

      <div class="btn-row">
        <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-primary" id="saveBtn">Save</button>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="toolbar">
      <h2 style="margin:0;">ගුරු ලේඛනය (Teacher Records)</h2>
      <div class="search">
        <input type="text" id="searchBox" placeholder="නම හෝ හැඳුනුම්පත් අංකයෙන් සොයන්න... (Search by name or NIC)">
      </div>
      <div>
        <button class="btn-secondary btn-small" id="exportBtn">Export CSV</button>
      </div>
    </div>
    <div class="count" id="countLabel"></div>
    <div class="table-scroll">
      <table id="recordsTable">
        <thead>
          <tr>
            <th>NIC</th>
            <th>නම</th>
            <th>තනතුර</th>
            <th>දුරකථනය</th>
            <th>බැංකුව / ශාඛාව</th>
            <th>ක්‍රියා</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="empty" id="emptyMsg" style="display:none;">තවම වාර්තා නොමැත (No records yet)</div>
  </div>

</div>

<script>
const STORAGE_KEY = 'teacherDatabaseRecords';
const fieldIds = ['nic','fullName','address','dob','gender','phone','whatsapp','position','grade',
  'firstAppointDate','schoolJoinDate','eduQual','profQual','regNo','worpNo','prevSchool',
  'prevPeriod','acctNo','bank','branch'];

function loadRecords(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error('Load error', e);
    return [];
  }
}

function saveRecords(records){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }catch(e){
    console.error('Save error', e);
    alert('දත්ත සුරැකීමේ දෝෂයක් (Error saving data)');
  }
}

let records = loadRecords();

const form = document.getElementById('teacherForm');
const tableBody = document.getElementById('tableBody');
const emptyMsg = document.getElementById('emptyMsg');
const countLabel = document.getElementById('countLabel');
const searchBox = document.getElementById('searchBox');
const formTitle = document.getElementById('formTitle');
const saveBtn = document.getElementById('saveBtn');
const cancelBtn = document.getElementById('cancelBtn');

function resetForm(){
  form.reset();
  document.getElementById('recordId').value = '';
  formTitle.textContent = 'නව ගුරුවරයෙකු එක් කරන්න (Add New Teacher)';
  saveBtn.textContent = 'Save';
}

function render(filter){
  const q = (filter || '').trim().toLowerCase();
  const filtered = records.filter(r=>{
    if(!q) return true;
    return (r.fullName||'').toLowerCase().includes(q) || (r.nic||'').toLowerCase().includes(q);
  });

  tableBody.innerHTML = '';
  if(filtered.length === 0){
    emptyMsg.style.display = 'block';
  }else{
    emptyMsg.style.display = 'none';
  }

  filtered.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(r.nic)}</td>
      <td>${escapeHtml(r.fullName)}</td>
      <td>${escapeHtml(r.position)}</td>
      <td>${escapeHtml(r.phone)}</td>
      <td>${escapeHtml(r.bank)}${r.branch ? ' / ' + escapeHtml(r.branch) : ''}</td>
      <td class="actions-cell">
        <button class="btn-secondary btn-small" data-edit="${r.id}">Edit</button>
        <button class="btn-danger" data-del="${r.id}">Delete</button>
      </td>
    `;
    tableBody.appendChild(tr);
  });

  countLabel.textContent = `මුළු වාර්තා ගණන (Total): ${records.length}` +
    (q ? ` — ${filtered.length} matching search` : '');
}

function escapeHtml(str){
  if(str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

form.addEventListener('submit', function(e){
  e.preventDefault();
  const id = document.getElementById('recordId').value || String(Date.now());
  const rec = { id };
  fieldIds.forEach(fid=>{
    rec[fid] = document.getElementById(fid).value.trim();
  });

  const existingIndex = records.findIndex(r=>r.id === id);
  if(existingIndex >= 0){
    records[existingIndex] = rec;
  }else{
    records.push(rec);
  }
  saveRecords(records);
  resetForm();
  render(searchBox.value);
});

cancelBtn.addEventListener('click', resetForm);

tableBody.addEventListener('click', function(e){
  const editId = e.target.getAttribute('data-edit');
  const delId = e.target.getAttribute('data-del');

  if(editId){
    const rec = records.find(r=>r.id === editId);
    if(!rec) return;
    document.getElementById('recordId').value = rec.id;
    fieldIds.forEach(fid=>{
      const el = document.getElementById(fid);
      if(el) el.value = rec[fid] || '';
    });
    formTitle.textContent = 'ගුරුවරයාගේ තොරතුරු සංස්කරණය (Edit Teacher)';
    saveBtn.textContent = 'Update';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  if(delId){
    if(confirm('මෙම වාර්තාව මකා දමන්නද? (Delete this record?)')){
      records = records.filter(r=>r.id !== delId);
      saveRecords(records);
      render(searchBox.value);
    }
  }
});

searchBox.addEventListener('input', function(){
  render(searchBox.value);
});

document.getElementById('exportBtn').addEventListener('click', function(){
  if(records.length === 0){
    alert('අපනයනය කිරීමට වාර්තා නොමැත (No records to export)');
    return;
  }
  const headers = fieldIds;
  const rows = records.map(r => headers.map(h => `"${(r[h]||'').replace(/"/g,'""')}"`).join(','));
  const csv = headers.join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'teacher-database.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

render('');
</script>

</body>
</html>
