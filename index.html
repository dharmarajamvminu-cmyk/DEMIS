<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & App View</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .login-card h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        #appView {
            display: none;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Section -->
        <div id="loginView" class="login-card">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit">Sign In</button>
                <div id="errorMessage" class="error-message"></div>
            </form>
        </div>

        <!-- Authenticated Application Section -->
        <div id="appView">
            <h2>Welcome Back!</h2>
            <p id="userInfo" style="margin: 15px 0; color: #555;"></p>
            <button id="logoutBtn" style="background-color: #dc3545;">Logout</button>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault(); // Prevents page refresh on form submit

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            errorMessage.textContent = '';

            // Simulate server response matching your backend structure
            const mockServerResponse = {
                email: email,
                user_type: "admin" // Backend returns user_type, not role
            };

            // Process authentication
            handleLoginSuccess(mockServerResponse);
        });

        function handleLoginSuccess(d) {
            // FIXED: Checking d.user_type instead of d.role
            if (d.user_type === 'admin' || d.user_type === 'user') {
                localStorage.setItem('currentUser', JSON.stringify(d));
                showAppView(d);
            } else {
                document.getElementById('errorMessage').textContent = 'Unauthorized user type.';
            }
        }

        function showAppView(user) {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('appView').style.display = 'block';
            document.getElementById('userInfo').textContent = `Logged in as: ${user.email} (${user.user_type})`;
        }

        document.getElementById('logoutBtn').addEventListener('click', function () {
            localStorage.removeItem('currentUser');
            document.getElementById('appView').style.display = 'none';
            document.getElementById('loginView').style.display = 'block';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        });

        // Check persistent login state on initial load
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                showAppView(JSON.parse(savedUser));
            }
        });
    </script>
</body>
</html>
